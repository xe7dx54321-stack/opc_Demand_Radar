[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "demand-radar"
version = "0.1.0"
description = "Internal demand discovery tool for manual signal intake and pain extraction."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Demand Radar Team" }
]
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "streamlit>=1.35",
  "typer>=0.12"
]


# NOTE: opc-foundation must be installed separately:
#   pip install -e ../opc-foundation
# Or copy opc_foundation src into site-packages (see README for details)
[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5"
]
full = []

[project.scripts]
demand-radar = "demand_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not slow'"
markers = [
    "slow: integration tests that run the full pipeline (deselect with -m not slow)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

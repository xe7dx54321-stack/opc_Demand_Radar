sources:
  - source_id: hacker_news_ai_investment
    source_name: Hacker News AI Investment Tracking
    source_type: community_discussion
    connector: hacker_news
    enabled: true
    trust_weight: 0.85
    default_queries:
      - AI startup tracking
      - VC deal sourcing tools
      - investment research workflow
      - market intelligence tools

  - source_id: github_issues_research_automation
    source_name: GitHub Issues Research Automation
    source_type: github_issue
    connector: github_issues
    enabled: true
    trust_weight: 0.85
    default_queries:
      - research automation
      - market intelligence
      - AI monitoring
      - startup data workflow

  - source_id: rss_ai_research_feeds
    source_name: AI Research RSS Feeds
    source_type: rss
    connector: rss
    enabled: true
    trust_weight: 0.60
    metadata:
      feed_urls:
        - https://news.ycombinator.com/rss
    default_queries: []

  - source_id: manual_urls_ai_investment
    source_name: Manual URL Seeds AI Investment
    source_type: manual_url
    connector: manual_url
    enabled: true
    trust_weight: 0.80
    metadata:
      input_csv: examples/source_seed_urls_ai_investment_tracking.csv
    default_queries: []